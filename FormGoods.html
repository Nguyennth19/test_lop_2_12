<form id="goodsForm" onsubmit="submitGoods(event)"><input type="hidden" name="id"><div class="formgrid"><label>Ngày nhận<input type="date" name="date" required></label><label>Học sinh<select name="studentId" id="goodsStudent" required></select></label><label class="wide">Người tặng / Người đóng góp (công khai khi ghi nhận hiện vật)<input name="donor" maxlength="150" autocomplete="off" placeholder="Có thể để trống: Phụ huynh bé…"></label><label class="wide">Tên sản phẩm<input name="product" required placeholder="Ví dụ: Sách tô màu, giấy thủ công…"></label><label>Số lượng<input type="number" name="quantity" min="0.01" step="any" required value="1"></label><label>Đơn vị<input name="unit" value="cái" placeholder="quyển, hộp, bộ…"></label><label class="wide">Ảnh sản phẩm<input name="image" type="file" accept="image/*"></label><label class="wide">Ghi chú công khai<textarea name="note"></textarea></label></div><div class="formactions"><button type="button" class="button subtle" onclick="closeForm()">Hủy</button><button class="button primary" type="submit">Lưu ủng hộ hiện vật</button></div></form>
