<form id="cashForm" onsubmit="submitCash(event)"><input type="hidden" name="id"><div class="formgrid"><label>Ngày thu<input type="date" name="date" required></label><label>Số tiền (VND)<input type="text" inputmode="numeric" autocomplete="off" data-money-input="1" name="amount" placeholder="500,000" required></label><label>Học sinh<select name="payerId" id="cashPayer" required></select></label><label>Người đóng (chỉ nội bộ)<input name="payerName" maxlength="150" autocomplete="off" placeholder="Tên người thực tế chuyển khoản (có thể để trống)"></label><label>Đợt thu<input name="batch" placeholder="Tự nguyện 10/2026"></label><label>Hình thức<select name="method"><option>Chuyển khoản</option><option>Tiền mặt</option></select></label><label class="wide">Ảnh chứng từ (không bắt buộc)<input type="file" name="image" accept="image/*"></label><label class="wide">Ghi chú nội bộ<textarea name="note"></textarea></label></div><p class="hint">Chỉ cộng vào tổng tiền, không công khai danh tính người đóng hay giao dịch.</p><div class="formactions"><button type="button" class="button subtle" onclick="closeForm()">Hủy</button><button class="button primary" type="submit">Lưu ủng hộ hiện kim</button></div></form>
