<section class="panel filterbar expense-filters" role="search" aria-label="Tìm kiếm khoản chi">
  <label class="expense-field"><span class="expense-label">Tìm kiếm</span><input id="expenseSearch" type="search" placeholder="Tìm khoản chi, mã giao dịch…" aria-label="Tìm khoản chi hoặc mã giao dịch"></label>
  <label class="expense-field"><span class="expense-label">Nhóm khoản chi</span><select id="expenseCategory" aria-label="Lọc theo nhóm khoản chi"><option value="">Tất cả nhóm khoản chi</option><option>Trang bị học tập</option><option>Hỗ trợ lớp học</option><option>Trang trí sự kiện</option><option>Khác</option></select></label>
  <label class="expense-field"><span class="expense-label">Thời gian</span><select id="expenseMonth" aria-label="Lọc theo tháng"><option value="">Mọi tháng</option></select></label>
</section>
<section class="panel expense-results" aria-label="Danh sách khoản chi"><div id="expenseTable"></div></section>
