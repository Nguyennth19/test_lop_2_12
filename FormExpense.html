<form id="expenseForm" onsubmit="submitExpense(event)"><input type="hidden" name="id"><div class="formgrid"><label>Ngày chi<input name="date" type="date" required></label><label>Số tiền (VND)<input name="amount" type="number" min="1" required></label><label>Nhóm khoản chi<select name="category"><option>Trang bị học tập</option><option>Hỗ trợ lớp học</option><option>Trang trí sự kiện</option><option>Khác</option></select></label><label>Hình thức chi<select name="method"><option>Chuyển khoản</option><option>Tiền mặt</option><option>Khác</option></select></label><label class="wide">Nội dung chi<input name="description" required placeholder="Mua gì, phục vụ hoạt động nào?"></label><label>Ảnh/chứng từ thanh toán<input name="receipt" type="file" accept="image/*,application/pdf"></label><label>Hình ảnh sản phẩm (không bắt buộc)<input name="productImage" type="file" accept="image/*"></label><label class="wide">Ghi chú công khai<textarea name="note"></textarea></label></div><div class="formactions"><button type="button" class="button subtle" onclick="closeForm()">Hủy</button><button class="button primary" type="submit">Lưu khoản chi</button></div></form>
