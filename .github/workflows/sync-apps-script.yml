name: Sync Google Apps Script
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apps-script-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate required secrets
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          CLASP_CREDENTIALS_JSON: ${{ secrets.CLASP_CREDENTIALS_JSON }}
        run: |
          test -n "$APPS_SCRIPT_ID" || { echo 'Missing APPS_SCRIPT_ID secret'; exit 1; }
          test -n "$CLASP_CREDENTIALS_JSON" || { echo 'Missing CLASP_CREDENTIALS_JSON secret'; exit 1; }
      - run: npm install -g @google/clasp@3
      - name: Configure clasp credentials
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          CLASP_CREDENTIALS_JSON: ${{ secrets.CLASP_CREDENTIALS_JSON }}
        run: |
          umask 077
          printf '%s' "$CLASP_CREDENTIALS_JSON" > "$HOME/.clasprc.json"
          node -e 'require("fs").writeFileSync(".clasp.json", JSON.stringify({scriptId:process.env.APPS_SCRIPT_ID,rootDir:"."}))'
      - name: Push source (no production deployment)
        run: clasp push --force
