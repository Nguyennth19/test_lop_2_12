<!DOCTYPE html><html><head><base target="_top"><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{font:13px 'Be Vietnam Pro',sans-serif;color:#24344c;padding:16px;background:#f7f9ff}h2{margin-top:0;color:#304cb3}label{font-weight:600;display:block;margin:12px 0 5px}input,select{width:100%;box-sizing:border-box;padding:10px;border-radius:9px;border:1px solid #b9c8e4;font:inherit;background:white}button{border:0;background:#5573d8;color:white;font-weight:700;padding:11px 14px;border-radius:10px;cursor:pointer;width:100%;margin-top:14px}.soft{background:#eaf1ff;padding:10px;border-radius:12px;color:#455e86}.result{margin-top:12px;white-space:pre-wrap}.list{margin-top:16px;border-top:1px solid #dce4f1;padding-top:12px}.item{padding:10px;background:white;border:1px solid #e0e7f4;border-radius:10px;margin:7px 0;word-break:break-word}.item button{width:auto;font-size:11px;padding:8px;margin:5px 3px 0 0;background:#a65f55}</style></head>
<body><h2>Tài khoản đăng nhập</h2><div class="soft">Tạo hoặc đặt lại mật khẩu trực tiếp từ Google Sheets. <b>Mật khẩu không được ghi vào ô tính.</b></div>
<form id="f"><label>Số điện thoại đăng nhập</label><input name="phone" type="tel" pattern="(?:0[35789][0-9]{8}|\+84[35789][0-9]{8})" placeholder="09xxxxxxxx" required autocomplete="off"><label>Mật khẩu</label><input name="password" type="password" minlength="6" maxlength="128" required autocomplete="new-password"><div style="color:#5d6c87;font-size:11px;margin-top:5px">Tối thiểu 6 ký tự; không bắt buộc chữ hoa, số hoặc ký tự đặc biệt.</div><label>Vai trò</label><select name="role"><option value="EDITOR">EDITOR — Nhập / sửa</option><option value="ADMIN">ADMIN — Toàn quyền</option></select><button id="save" type="submit">Tạo / cập nhật tài khoản</button></form>
<div class="result" id="msg"></div><div class="list"><b>Danh sách tài khoản</b><div id="list">Đang đọc...</div></div>
<script>
const E=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
function refresh(){google.script.run.withSuccessHandler(x=>{E('list').innerHTML=x.accounts.length?x.accounts.map(u=>`<div class="item"><b>${esc(u.phone)}</b><div>${esc(u.role)} · ${esc(u.status)}</div><button data-phone="${esc(u.phone)}" data-state="${u.status==='ACTIVE'?'DISABLED':'ACTIVE'}" onclick="changeStatus(this)">${u.status==='ACTIVE'?'Khóa':'Mở khóa'}</button></div>`).join(''):'Chưa có tài khoản nào.'}).withFailureHandler(e=>E('list').textContent=e.message).accountSheetState()}
function changeStatus(btn){if(!confirm('Đổi trạng thái tài khoản '+btn.dataset.phone+'?'))return;google.script.run.withSuccessHandler(refresh).withFailureHandler(e=>E('msg').textContent=e.message).accountSheetSetStatus(btn.dataset.phone,btn.dataset.state)}
E('f').addEventListener('submit',ev=>{ev.preventDefault();const obj=Object.fromEntries(new FormData(ev.target).entries());E('save').disabled=true;google.script.run.withSuccessHandler(x=>{E('msg').textContent='Đã lưu: '+x.phone+' ('+x.role+'). Mật khẩu đã được mã hóa trong USERS.';E('f').reset();E('save').disabled=false;refresh()}).withFailureHandler(e=>{E('msg').textContent=e.message;E('save').disabled=false}).accountSheetSave(obj)});
refresh();
</script></body></html>
